<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unsubscribe | Crypgo</title>
</head>
<body style="margin:0;background:#f4f6f8;color:#17212b;font-family:Arial,Helvetica,sans-serif;">
    <main style="max-width:560px;margin:64px auto;padding:32px;background:#ffffff;border:1px solid #dfe5ea;">
        <h1 style="margin-top:0;">Unsubscribe from Crypgo emails</h1>
        <p>Enter your email address to stop receiving campaign messages.</p>
        <form method="post" action="{% url 'unsubscribes:unsubscribe_process' %}">
            {% csrf_token %}
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" value="{{ email }}" required style="display:block;width:100%;box-sizing:border-box;margin:8px 0 20px;padding:10px;">
            <label for="reason">Reason (optional)</label>
            <textarea id="reason" name="reason" rows="4" style="display:block;width:100%;box-sizing:border-box;margin:8px 0 20px;padding:10px;"></textarea>
            <button type="submit" style="padding:10px 18px;background:#10251b;color:#ffffff;border:0;cursor:pointer;">Unsubscribe</button>
        </form>
    </main>
</body>
</html>
