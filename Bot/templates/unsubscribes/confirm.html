<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unsubscribe</title>
</head>
<body>
    <main>
        <h1>Unsubscribe</h1>
        <p>Confirm that you want to stop receiving emails for {{ email }}.</p>
        <form method="post" action="{% url 'unsubscribes:unsubscribe_process_legacy' email=email %}">
            {% csrf_token %}
            <label for="reason">Reason (optional)</label>
            <textarea id="reason" name="reason"></textarea>
            <button type="submit">Confirm unsubscribe</button>
        </form>
    </main>
</body>
</html>
