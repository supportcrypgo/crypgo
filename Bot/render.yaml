services:
  - type: web
    name: email-bot
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py force_reset_admin
      python manage.py collectstatic --noinput
    startCommand: gunicorn bot_project.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: email-bot-db
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: support.crypgo@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: support.crypgo@gmail.com
      - key: SITE_URL
        value: https://email-bot.onrender.com
      - key: CRYPGO_SERVICE_KEY
        sync: false
databases:
  - name: email-bot-db
    plan: free
