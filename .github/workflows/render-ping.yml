name: Keep Render Services Awake

on:
  schedule:
    - cron: '*/13 * * * *'  # Every 13 minutes
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  ping-services:
    name: Ping Render Services
    runs-on: ubuntu-latest
    env:
      SERVICES: |
        https://crypgo-api.onrender.com/
        https://crypgo-6llg.onrender.com/
        https://crypgo-email.onrender.com/
        https://crypgo-ws.onrender.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ping all Render services
        id: ping
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "=== Render Service Ping Started at $TIMESTAMP ==="
          echo ""
          
          # Convert SERVICES env var to an array without requiring a NUL terminator.
          mapfile -t SERVICE_URLS <<< "${SERVICES}"
          
          FAILED=0
          RESULTS="| Service | Status | Response Time | HTTP Code |\n|---------|--------|---------------|-----------|\n"
          
          for URL in "${SERVICE_URLS[@]}"; do
            # Skip empty lines
            [ -z "$URL" ] && continue
            
            echo "Pinging: $URL"
            
            # Time the request and capture HTTP code
            START=$(date +%s%3N)
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" 2>/dev/null || echo "000")
            END=$(date +%s%3N)
            RESPONSE_TIME=$((END - START))
            
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
              STATUS="✅ UP"
              HTTP_CODE="$RESPONSE"
            else
              STATUS="❌ DOWN"
              HTTP_CODE="$RESPONSE"
              FAILED=1
            fi
            
            # Format service name
            SERVICE_NAME=$(echo "$URL" | sed 's|https://||' | sed 's|/||' | sed 's|\.onrender\.com||')
            RESULTS="${RESULTS}| $SERVICE_NAME | $STATUS | ${RESPONSE_TIME}ms | $HTTP_CODE |\n"
            
            echo "  Status: $STATUS (HTTP $HTTP_CODE, ${RESPONSE_TIME}ms)"
          done
          
          echo ""
          echo "=== Summary ==="
          echo -e "$RESULTS"
          
          # Save results for next steps
          echo "results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Print results summary
        if: always()
        run: |
          echo "${{ steps.ping.outputs.results }}"

      - name: Send failure notification email
        if: steps.ping.outputs.failed == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 CRITICAL: Render Service(s) DOWN - Crypgo"
          to: support.crypgo@gmail.com
          from: Crypgo Monitor <support.crypgo@gmail.com>
          body: |
            # Render Service Alert
            
            One or more Render services are **DOWN** as of ${{ steps.ping.outputs.timestamp }}.
            
            ## Service Status
            ${{ steps.ping.outputs.results }}
            
            ## Action Required
            Please check the Render dashboard for the affected service(s):
            - https://dashboard.render.com/
            
            ## Services Monitored
            - crypgo-api: https://crypgo-api.onrender.com/
            - crypgo-6llg: https://crypgo-6llg.onrender.com/
            - crypgo-email: https://crypgo-email.onrender.com/
            - crypgo-ws: https://crypgo-ws.onrender.com/
            
            ---
            *This alert was sent automatically by GitHub Actions workflow "Keep Render Services Awake"*
          content_type: text/markdown

      - name: Fail workflow when services are down
        if: steps.ping.outputs.failed == '1'
        run: |
          echo "::error::One or more Render services are DOWN!"
          exit 1
