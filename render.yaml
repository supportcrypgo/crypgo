services:
  - type: web
    name: crypgo-frontend
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRYPGO_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: /backend-api
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  - type: web
    name: crypgo-api
    env: python
    rootDir: django_backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: crypgo
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CRYPGO_SERVICE_KEY
        generateValue: true
      - key: USE_GMAIL_API
        value: "True"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "support.crypgo@gmail.com"
      - key: EMAIL_FROM_NAME
        value: "Crypgo"
  - type: web
    name: crypgo-email
    env: python
    rootDir: Bot
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn bot_project.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: emailbot
      - key: ALLOWED_HOSTS
        sync: false
      - key: SITE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: USE_GMAIL_API
        value: "True"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "support.crypgo@gmail.com"
      - key: EMAIL_FROM_NAME
        value: "Crypgo"
      - key: EMAIL_X_MAILER
        value: "Crypgo Mailer"
      - key: CRYPGO_API_URL
        sync: false
      - key: CRYPGO_SERVICE_KEY
        sync: false
  - type: web
    name: crypgo-websocket
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: node server/wsServer.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: COINGECKO_API_KEY
        sync: false

# Free tier deployment. Local SQLite data is ephemeral on Render Free.
# Services sleep after 15 minutes of inactivity and wake on the next request.
# Use an external DATABASE_URL when data must survive restarts and deploys.
