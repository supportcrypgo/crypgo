# Secrets are managed in the Render dashboard and should never be committed here.
# Keep this file as a deployment template only.

services:
  - type: web
    name: crypgo-frontend
    env: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRYPGO_BACKEND_URL
        value: "https://crypgo-api.onrender.com"
      - key: NEXT_PUBLIC_API_URL
        value: /backend-api
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://crypgo-ws.onrender.com"
      - key: COINGECKO_API_KEY
        sync: false

  - type: web
    name: crypgo-api
    env: python
    rootDir: django_backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: crypgo
      - key: ALLOWED_HOSTS
        value: "crypgo-api.onrender.com"
      - key: FRONTEND_URL
        value: "https://crypgo-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://crypgo-frontend.onrender.com"]'
      - key: CSRF_TRUSTED_ORIGINS
        value: '["https://crypgo-frontend.onrender.com"]'
      - key: CRYPGO_SERVICE_KEY
        generateValue: true
      - key: USE_GMAIL_API
        value: "True"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "support.crypgo@gmail.com"
      - key: EMAIL_FROM_NAME
        value: "Crypgo"
  - type: web
    name: crypgo-email
    env: python
    rootDir: Bot
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py force_reset_admin && python manage.py collectstatic --noinput
    startCommand: gunicorn bot_project.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: ALLOWED_HOSTS
        value: "crypgo-email.onrender.com"
      - key: SITE_URL
        value: "https://crypgo-email.onrender.com"
      - key: FRONTEND_URL
        value: "https://crypgo-frontend.onrender.com"
      - key: USE_GMAIL_API
        value: "True"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "support.crypgo@gmail.com"
      - key: EMAIL_FROM_NAME
        value: "Crypgo"
      - key: EMAIL_X_MAILER
        value: "Crypgo Mailer"
      - key: CRYPGO_API_URL
        value: "https://crypgo-api.onrender.com"
      - key: CRYPGO_SERVICE_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@crypgo.com"
  - type: web
    name: crypgo-ws
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: node server/wsServer.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: COINGECKO_API_KEY
        sync: false

# Free tier deployment. Local SQLite data is ephemeral on Render Free.
# Services sleep after 15 minutes of inactivity and wake on the next request.
# Use an external DATABASE_URL when data must survive restarts and deploys.