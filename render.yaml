services:
  - type: web
    name: crypgo-api
    runtime: python
    rootDir: django_backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CRYPGO_SERVICE_KEY
        sync: false

  - type: web
    name: crypgo-websocket
    runtime: node
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: node server/wsServer.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COINGECKO_API_KEY
        sync: false

# Attach a managed PostgreSQL database in Render and set its connection string
# as DATABASE_URL on crypgo-api. Keep the Bot database separate.
